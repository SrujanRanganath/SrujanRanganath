<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="Think beyond code. Build beyond limits." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#312E81"/><stop offset="0.5" stop-color="#172554"/><stop offset="1" stop-color="#020617"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0" r="0.7"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#312E81"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#312E81"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#67E8F9" stroke-opacity="0.06" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="180" fill="url(#bg)"/>
<rect width="1000" height="180" fill="url(#grid)"/>
<rect width="1000" height="180" fill="url(#glow)"/>
<rect width="1000" height="3" fill="url(#top)"/>
<rect width="220" height="3" fill="#F0F9FF" opacity="0.7"><animate attributeName="x" values="-220;1000" dur="6s" repeatCount="indefinite"/></rect>
<text x="500" y="82" text-anchor="middle" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#F0F9FF" textLength="440" lengthAdjust="spacing">THINK BEYOND CODE.</text>
<text x="500" y="122" text-anchor="middle" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#67E8F9" textLength="500" lengthAdjust="spacing">BUILD BEYOND LIMITS.</text>
<text x="500" y="158" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Consolas,Menlo,'Courier New',monospace" font-size="13" letter-spacing="2" fill="#94A3B8">SRUJAN RANGANATH  |  AI &amp; SOFTWARE ENGINEERING</text>
</svg>
