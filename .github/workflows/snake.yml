name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Build snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate SVGs (light and dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%234F46E5&color_dots=%23E0F2FE,%23BAE6FD,%237DD3FC,%2338BDF8,%230284C7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23818CF8&color_dots=%230B1220,%23164E63,%230E7490,%2306B6D4,%2367E8F9

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
